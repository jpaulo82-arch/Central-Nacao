# ============================================================================
# Central da Nação — Worker de matchday (GitHub Actions)
# Fase: Integração e Finalização | 2026-09-09 | pt-BR
#
# Blueprint: "Matchday poll | kickoff-90min até FT+30 | poll_match a cada 30s".
# Limite da plataforma: o cron do GitHub Actions tem intervalo MÍNIMO de 5
# minutos (30s exigiria runner self-hosted/Cloud Scheduler — decisão humana;
# ver GUIA_DE_CONFIGURACAO_ENV.md). Este workflow:
#   1. acorda a cada 5 min e verifica se há janela de jogo ativa;
#   2. fora da janela, termina em segundos (custo mínimo);
#   3. na janela, busca o estado real (API de futebol), compara com o último
#      estado (Supabase `matches`) e emite MatchTick em transições de estado;
#   4. só sincroniza estado REAL na nuvem — fixtures mock nunca são publicadas.
# ============================================================================
name: central-da-nacao-matchday

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 min (UTC) — guard interno decide se há jogo
  workflow_dispatch:

concurrency:
  group: cdn-matchday
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  poll:
    name: Poll de jogo (janela kickoff−90min … FT+30)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Instalar dependências
        run: pip install -r tools/requirements.txt
      - name: Montar .env
        run: |
          umask 077
          : > tools/.env
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" >> tools/.env
          printf 'SUPABASE_KEY=%s\n' "$SUPABASE_KEY" >> tools/.env
          printf 'API_FUTEBOL_KEY=%s\n' "${API_FUTEBOL_KEY:-}" >> tools/.env
        env:
          API_FUTEBOL_KEY: ${{ secrets.API_FUTEBOL_KEY }}
      - name: Estado anterior (último poll na nuvem)
        id: prev
        run: |
          python3 .github/scripts/state_bridge.py pull-match-state --out /tmp/prev_match.json
          if [ ! -s /tmp/prev_match.json ]; then
            echo "Sem jogo scheduled/live no Supabase — nada a observar."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Janela ativa? (kickoff−90min … live … FT+30 aprox.)
        if: steps.prev.outputs.active == 'true'
        id: window
        run: python3 .github/scripts/matchday_window.py /tmp/prev_match.json >> "$GITHUB_OUTPUT"
      - name: Buscar estado atual (provedor real)
        if: steps.window.outputs.active == 'true'
        id: poll
        run: |
          python3 tools/ingest_match.py --fixture fixtures/match_scheduled.json > /tmp/poll_report.json 2>&1 || { cat /tmp/poll_report.json; exit 1; }
          cat /tmp/poll_report.json
          python3 -c "import json;r=json.load(open('/tmp/poll_report.json'));print('mock='+str(r.get('mock')))" >> "$GITHUB_OUTPUT"
      - name: Emitir tick se houve transição (nunca em modo mock)
        if: steps.poll.outputs.mock == 'False'
        id: tick
        run: |
          CURRENT=$(python3 -c "import json;print(json.load(open('/tmp/poll_report.json'))['output'])")
          echo "current_file=$CURRENT" >> "$GITHUB_OUTPUT"
          python3 tools/emit_match_tick.py --previous /tmp/prev_match.json --current "$CURRENT" > /tmp/tick_report.json || { cat /tmp/tick_report.json; exit 1; }
          cat /tmp/tick_report.json
          python3 -c "import json;r=json.load(open('/tmp/tick_report.json'));print('emitted='+str(r.get('emitted')))" >> "$GITHUB_OUTPUT"
      - name: Sincronizar estado atual na nuvem (baseline do próximo poll)
        if: steps.tick.outcome == 'success'
        run: |
          python3 .github/scripts/state_bridge.py push-match --file "$CURRENT_FILE"
        env:
          CURRENT_FILE: ${{ steps.tick.outputs.current_file }}
      - name: Notificar tick no canal do editor (webhook)
        if: steps.tick.outputs.emitted == 'True'
        run: python3 .github/scripts/notify_tick.py /tmp/tick_report.json
        env:
          EDITOR_WEBHOOK_URL: ${{ secrets.EDITOR_WEBHOOK_URL }}
      - name: Resumo no job
        if: always()
        run: |
          {
            echo "## Matchday poll $(date -u -d '3 hours ago' +'%F %H:%M') (BRT)"
            echo "- janela ativa: ${{ steps.window.outputs.active || 'n/a' }}"
            echo "- modo mock: ${{ steps.poll.outputs.mock || 'n/a' }}"
            echo "- tick emitido: ${{ steps.tick.outputs.emitted || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
